[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
# Streamlit's default primary is red. Red already means "flagged athlete" on this
# page, so a filter chip painted red reads as an alert.
primaryColor = "#2a78d6"
# The page sits slightly below white and cards are pushed to white on top of it.
# Depth comes from the lightness difference rather than from a drop shadow.
backgroundColor = "#f6f5f2"
secondaryBackgroundColor = "#eeece7"
textColor = "#0b0b0b"
